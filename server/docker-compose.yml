services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keeper
      POSTGRES_PASSWORD: keeper
      POSTGRES_DB: keeper
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - keeper-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeper -d keeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    working_dir: /app
    command: sh -c "npm run db:migrate && npm run start"
    environment:
      DATABASE_URL: postgres://keeper:keeper@postgres:5432/keeper
      REDIS_URL: redis://redis:6379
      PORT: 8787
      SERVER_GIT_REMOTE_URL: ${SERVER_GIT_REMOTE_URL:-}
      SERVER_GIT_REPO_DIR: /data/repos/keeper-notes
      SERVER_GIT_BRANCH: main
      SERVER_GITHUB_TOKEN: ${SERVER_GITHUB_TOKEN:-}
      KEEPER_SEED_TOKEN: ${KEEPER_SEED_TOKEN:-}
      KEEPER_CORS_ALLOWED_ORIGINS: ${KEEPER_CORS_ALLOWED_ORIGINS:-tauri://localhost,http://tauri.localhost}
      KEEPER_RATE_LIMIT_MAX: ${KEEPER_RATE_LIMIT_MAX:-120}
      KEEPER_RATE_LIMIT_WINDOW_MS: ${KEEPER_RATE_LIMIT_WINDOW_MS:-60000}
      KEEPER_SYNC_BODY_LIMIT_BYTES: ${KEEPER_SYNC_BODY_LIMIT_BYTES:-16777216}
      MOC_CLASSIFY_DELAY_MS: ${MOC_CLASSIFY_DELAY_MS:-15000}
    volumes:
      - keeper-notes:/data/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
    working_dir: /app
    command: npm run worker:start
    environment:
      DATABASE_URL: postgres://keeper:keeper@postgres:5432/keeper
      REDIS_URL: redis://redis:6379
      SERVER_GIT_REMOTE_URL: ${SERVER_GIT_REMOTE_URL:-}
      SERVER_GIT_REPO_DIR: /data/repos/keeper-notes
      SERVER_GIT_BRANCH: main
      SERVER_GITHUB_TOKEN: ${SERVER_GITHUB_TOKEN:-}
      SERVER_GITHUB_COMMIT_ATTEMPTS: ${SERVER_GITHUB_COMMIT_ATTEMPTS:-4}
      GIT_SYNC_JOB_ATTEMPTS: ${GIT_SYNC_JOB_ATTEMPTS:-8}
      GIT_SYNC_RETRY_DELAY_MS: ${GIT_SYNC_RETRY_DELAY_MS:-1000}
      MOC_PIPELINE_PATH: /opt/keeper/moc_pipeline/pipeline.py
      MOC_ARTIFACTS_DIR: /data/moc
      MOC_CLASSIFY_DELAY_MS: ${MOC_CLASSIFY_DELAY_MS:-15000}
      HF_HOME: /data/models/huggingface
    volumes:
      - keeper-notes:/data/repos
      - keeper-moc:/data/moc
      - keeper-models:/data/models
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    build:
      context: ./caddy
    environment:
      KEEPER_API_DOMAIN: ${KEEPER_API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - keeper-caddy-data:/data
      - keeper-caddy-config:/config
    depends_on:
      api:
        condition: service_started

volumes:
  keeper-postgres:
  keeper-notes:
  keeper-moc:
  keeper-models:
  keeper-caddy-data:
  keeper-caddy-config:
